# Container output (e.g. nginx's access log) is kept in at most 3 files of 10 MB each.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Memory caps keep one container from starving the others (and other apps on the same host).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-wtech}-app
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1G
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-wtech}-scheduler
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 512M
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
      - ./docker/php.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: ${CONTAINER_PREFIX:-wtech}-nginx
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8082}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - app

  db:
    image: postgres:18
    container_name: ${CONTAINER_PREFIX:-wtech}-db
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata18:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    networks:
      - app-network

  # Front-end build tools, only started on demand:
  #   docker compose run --rm assets npm ci
  #   docker compose run --rm assets npm run build:css
  assets:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /app
    user: "${UID:-1000}:${UID:-1000}"
    volumes:
      - ./:/app

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  # PostgreSQL 18 data (postgres:18 mounts /var/lib/postgresql); dbdata is the old PostgreSQL 15 volume, kept for rollback
  dbdata18:
    driver: local
