# the visitor's IP comes from the Tailscale sidecar, which reaches nginx over a Docker
# network (all in 172.16.0.0/12); requests without the header keep the peer address
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log combined;
    # a copy on the host for the traffic dashboard (ACCESS_LOG_DIR in .env)
    access_log /var/log/nginx/shared/access.log combined;

    # don't advertise the nginx version
    server_tokens off;

    # security headers on every response (none of the locations below set their own)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # matches post_max_size in php.ini, so image uploads reach Laravel's validation
    client_max_body_size 40M;
    root /var/www/public;

    # Docker's DNS; re-resolve the PHP container so recreating it doesn't leave a stale IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    # relative Location headers, so redirects keep the public host of the proxy in front
    absolute_redirect off;

    # the shop used to live under /wtech: send old links and bookmarks to the new paths
    location = /wtech {
        return 301 /;
    }

    location ^~ /wtech/ {
        rewrite ^/wtech/(.*)$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # uploaded files are only ever served as files, never run
    location ~* ^/uploads/.*\.(?:php|phtml|phar)$ {
        return 403;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|ttf|otf|woff|woff2|eot|mp4|webm|avi|mov|m4v|ogg|ogv|json|xml)$ {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
