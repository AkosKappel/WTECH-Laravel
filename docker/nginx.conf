server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # relative Location headers, so redirects keep the public host of the proxy in front
    absolute_redirect off;

    # the shop used to live under /wtech: send old links and bookmarks to the new paths
    location = /wtech {
        return 301 /;
    }

    location ^~ /wtech/ {
        rewrite ^/wtech/(.*)$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # uploaded files are only ever served as files, never run
    location ~* ^/uploads/.*\.(?:php|phtml|phar)$ {
        return 403;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|ttf|otf|woff|woff2|eot|mp4|webm|avi|mov|m4v|ogg|ogv|json|xml)$ {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
