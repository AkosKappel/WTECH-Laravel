upload_max_filesize=40M
post_max_size=40M
; enough to re-encode a ~40-megapixel photo; keeps a few stuck requests from using all memory
memory_limit=256M
; a normal page takes well under a second; the scheduler's CLI runs are not limited by this
max_execution_time=30
; don't advertise the PHP version in an X-Powered-By header
expose_php=Off
; OPcache (on by default): room for Laravel and its vendor files; timestamps are still checked
; every 2 s, because deploys change the bind-mounted code in place
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
